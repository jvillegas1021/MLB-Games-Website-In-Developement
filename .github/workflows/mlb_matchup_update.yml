name: Run MLB Matchup Update (R)

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  run-r--mlb-matchup-update:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_SSLMODE: ${{ secrets.DB_SSLMODE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("curl", "tidyverse", "DBI", "RPostgres"))'
          Rscript -e 'stopifnot(requireNamespace("curl", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("tidyverse", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("DBI", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("RPostgres", quietly = TRUE))'

      - name: Run MLB matchup update
        run: Rscript backend/r_pipelines/scripts/update_mlb_future_matchup_card_script.r
